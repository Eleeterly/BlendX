<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchfab → Blender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: #1a1a1a;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      padding-bottom: 12px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #E87D0D, #c86600);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 28px; }
    .header-text h1 { font-size: 15px; font-weight: 700; color: #fff; }
    .header-text p  { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 2px; }

    /* Section */
    .section { padding: 14px 16px 0; }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
    }

    /* Input */
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #E87D0D; }

    .input-row { display: flex; gap: 8px; margin-top: 6px; }
    .btn-save {
      padding: 9px 14px;
      background: #E87D0D;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #f59332; }

    .help-link {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: #E87D0D;
      text-decoration: none;
    }
    .help-link:hover { text-decoration: underline; }

    /* Bridge status */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #252525;
      border-radius: 8px;
      margin-top: 6px;
    }
    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #555;
      margin-right: 8px;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.online  { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
    .status-dot.offline { background: #e74c3c; }
    .status-text { display: flex; align-items: center; font-size: 12px; }
    .btn-check {
      padding: 5px 10px;
      background: #333;
      color: #ccc;
      border: none;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-check:hover { background: #444; }

    /* Saved indicator */
    .saved-msg {
      font-size: 11px;
      color: #2ecc71;
      margin-top: 5px;
      height: 14px;
      transition: opacity 0.3s;
    }

    /* Divider */
    .divider { height: 1px; background: #2e2e2e; margin: 14px 16px 0; }

    /* Footer */
    .footer {
      padding: 10px 16px 0;
      font-size: 10px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">🎮</div>
  <div class="header-text">
    <h1>Sketchfab → Blender</h1>
    <p>One-click 3D model importer</p>
  </div>
</div>

<!-- API Token -->
<div class="section">
  <div class="section-label">Sketchfab API Token</div>
  <div class="input-row">
    <input type="password" id="apiToken" placeholder="Paste your API token here…" autocomplete="off">
    <button class="btn-save" id="saveBtn">Save</button>
  </div>
  <div class="saved-msg" id="savedMsg"></div>
  <a href="https://sketchfab.com/settings/password" target="_blank" class="help-link">
    ↗ Get your token at sketchfab.com/settings/password
  </a>
</div>

<div class="divider"></div>

<!-- Bridge Server -->
<div class="section">
  <div class="section-label">Bridge Server</div>
  <div class="status-row">
    <div class="status-text">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Not checked</span>
    </div>
    <button class="btn-check" id="checkBtn">Check</button>
  </div>
</div>

<div class="divider"></div>

<div class="section">
  <div class="section-label">Help</div>
  <a href="https://discord.com/channels/1416060396128964712/1428358325887700992" target="_blank" class="help-link">
    💬 Join our Discord Server for support
  </a>
</div>

<div class="section">
  <div class="section-label">Source</div>
  <a href="https://github.com/Eleeterly/BlendX" target="_blank" class="help-link">
    💻 Source Code
  </a>
</div>

<div class="divider"></div>

<div class="footer">
  Make sure <strong style="color:#aaa">bridge_server.py</strong> is running before using the import button on Sketchfab.
</div>

<script src="popup.js"></script>
</body>
</html>
